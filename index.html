<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MANALCHEMY</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1020;color:#eee;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
/* スマホ操作性 */
html{touch-action:manipulation}
button{font-family:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.core{width:min(62vw,260px);height:min(62vw,260px);min-width:180px;min-height:180px}
.buy{min-height:44px;font-size:12px}
.buy-mode{min-height:42px;font-size:12px}
.card{min-height:62px}
.tabs{position:sticky;bottom:0;padding:8px 0;background:linear-gradient(transparent,#0b0d18 22%);z-index:5}
@media (max-width:380px){
  .app{padding:10px 8px 18px}
  .title{font-size:21px}
  .amount{font-size:30px}
  .core{min-width:170px;min-height:170px}
  .card{gap:6px;padding:7px}
  .icon{width:34px;height:34px}
  .buy{flex-basis:72px;min-width:72px;padding:8px 5px}
}

.app{width:min(100%,520px);min-height:100vh;margin:auto;background:linear-gradient(#171a32,#0b0d18);padding:14px 12px 22px}
.header{text-align:center}.title{font-size:24px;font-weight:800;letter-spacing:.12em}.subtitle{font-size:11px;color:#a8acd0;margin-top:2px}
.mana{margin-top:14px;text-align:center}.mana-label{font-size:12px;color:#9fa4c5}.amount{font-size:34px;font-weight:800;line-height:1.1;margin:3px 0}.rate{font-size:12px;color:#bfc4e8}
.core{width:190px;height:190px;margin:18px auto;border-radius:50%;display:grid;place-items:center;position:relative;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;background:radial-gradient(circle,#a99cff 0 8%,#6158b9 9% 20%,#25264d 21% 58%,#12152b 59%);box-shadow:0 0 35px #776bff88,inset 0 0 35px #000}
.core:before{content:"";position:absolute;inset:10px;border:1px solid #aaa5ff88;border-radius:50%;animation:spin 8s linear infinite}.core:after{content:"✦";font-size:44px;text-shadow:0 0 25px #fff}
.tap{font-size:12px;color:#c9cbed;margin-top:-8px;text-align:center}
.section{margin-top:18px}.section h2{font-size:14px;margin:0 0 8px;color:#d8daf0}
.card{display:flex;gap:9px;align-items:center;padding:9px;border:1px solid #292d4d;background:#171a2d;border-radius:12px;margin:7px 0}
.icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#222644;font-size:20px;flex:none}
.icon.circle{position:relative;background:radial-gradient(circle,transparent 0 27%,#b49cff 28% 30%,transparent 31% 47%,#8b7cf6 48% 50%,transparent 51%);border:1px solid #7d72d8}
.icon.circle:before,.icon.circle:after{content:"";position:absolute;inset:5px;border:1px solid #9f94ff;border-radius:50%;transform:rotate(60deg)}
.icon.circle:after{transform:rotate(-60deg)}
.icon.globe{position:relative;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b7d7ff,#5062b5 55%,#20284e);border:1px solid #aebdff}
.icon.globe:before{content:"";position:absolute;inset:6px;border:1px solid #d4dcff66;border-radius:50%}
.icon.globe:after{content:"";position:absolute;width:24px;height:12px;border:1px solid #d4dcff88;border-radius:50%;top:12px;left:6px}
.icon.cube{position:relative;background:#32171f}
.icon.cube:before{content:"";position:absolute;width:22px;height:22px;transform:rotate(30deg) skewY(-10deg);border:2px solid #e05a63;box-shadow:0 0 10px #c33a4d88}
.icon.cube:after{content:"";position:absolute;width:10px;height:10px;border:1px solid #ff8790;transform:rotate(30deg);top:10px;left:12px}
.info{min-width:0;flex:1;overflow:hidden}.name{font-weight:700;font-size:14px}.lv{font-size:10px;color:#b9bee1;margin-left:6px}.desc{font-size:10px;color:#9096ba;margin-top:2px}
.buy{flex:0 0 76px;white-space:nowrap;overflow:hidden;border:0;border-radius:9px;padding:9px 8px;background:#6e62d8;color:white;font-weight:700;font-size:11px;min-width:76px}.buy:disabled{opacity:.35}
.save-controls{display:flex;gap:6px;margin:8px 0 4px}.save-controls button{min-height:36px}.buy-controls{display:flex;gap:6px;margin:8px 0 4px}.buy-mode{flex:1;padding:7px 4px;border-radius:8px;background:#171a2d;border:1px solid #292d4d;color:#b9bee1;font-size:11px}.buy-mode.active{background:#6e62d8;color:#fff;border-color:#6e62d8}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.tab{padding:10px;border-radius:10px;background:#171a2d;border:1px solid #292d4d;text-align:center;font-size:11px;color:#b9bee1}
@keyframes spin{to{transform:rotate(360deg)}}.pop{position:fixed;pointer-events:none;font-weight:800;color:#e9e7ff;animation:pop .7s ease-out forwards}
@keyframes pop{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-65px)}}

/* 錬成ウィンドウ */
.alchemy-modal{position:fixed;inset:0;background:#050711cc;backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.alchemy-modal.open{display:flex}
.alchemy-window{width:min(100%,500px);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#1b1e39,#0d1020);border:1px solid #4b4f83;border-radius:18px;box-shadow:0 0 45px #6e62d855,0 18px 60px #000b;padding:16px}
.alchemy-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.alchemy-title{font-size:20px;font-weight:800;letter-spacing:.08em}
.alchemy-close{width:38px;height:38px;border:1px solid #34385e;border-radius:10px;background:#171a2d;color:#ddd;font-size:20px}
.alchemy-list{display:grid;gap:9px}
.alchemy-card{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #2d3154;background:#15182b;border-radius:13px}
.alchemy-card.done{border-color:#7168d6;background:linear-gradient(135deg,#191a31,#24204a)}
.alchemy-icon{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:25px;background:#222644;border:1px solid #383d68;box-shadow:inset 0 0 15px #0008}
.alchemy-info{min-width:0;flex:1}.alchemy-name{font-weight:800;font-size:13px}.alchemy-desc{font-size:10px;color:#a7acce;margin-top:2px;line-height:1.35}.alchemy-owned{font-size:10px;color:#c9cbed;margin-top:3px}
.alchemy-buy{flex:0 0 78px;min-height:42px;border:0;border-radius:9px;background:#6e62d8;color:#fff;font-weight:800;font-size:11px}.alchemy-buy:disabled{opacity:.35}
.alchemy-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;padding:7px 9px;border-radius:9px;background:#101328;border:1px solid #30355a;font-size:10px}
.toggle-btn{min-width:62px;padding:7px;border:0;border-radius:8px;background:#34395f;color:#cdd0ed;font-weight:800}
.toggle-btn.on{background:#6e62d8;color:#fff}
.alchemy-status{font-size:10px;color:#9ea4c9;margin-top:8px;text-align:center}
.alchemy-icon.hourglass{background:radial-gradient(circle,#e7d8ff 0 5%,transparent 6%),linear-gradient(135deg,#352a63,#15182b)}
.alchemy-icon.automaton{background:radial-gradient(circle,#d7d0ff 0 8%,#6e62d8 9% 15%,transparent 16%),linear-gradient(135deg,#252a4d,#171a2d)}
.alchemy-icon.engine{background:radial-gradient(circle,#ffcf7a 0 8%,#8c5d36 9% 15%,transparent 16%),linear-gradient(135deg,#432d28,#171a2d)}
.alchemy-icon.space{background:radial-gradient(circle at 35% 30%,#fff 0 3%,transparent 4%),radial-gradient(circle at 70% 65%,#c9c2ff 0 3%,transparent 4%),radial-gradient(circle,#24204f,#0a0c1b)}
.alchemy-icon.blood{background:radial-gradient(circle at 50% 42%,#ff5b67 0 8%,#7b182c 9% 18%,transparent 19%),linear-gradient(160deg,#2b111d,#090b18)}

</style>
</head>
<body>
<div class="app">
<header class="header"><div class="title">MANALCHEMY</div><div class="subtitle">マナを生み、世界を錬成する</div></header>
<div class="mana"><div class="mana-label">MANA</div><div id="amount" class="amount">0</div><div id="rate" class="rate">+0 / 秒</div></div>
<div id="core" class="core"></div><div class="tap">タップしてマナを錬成</div>
 <div class="save-controls">
   <button id="save-btn" class="buy-mode" type="button">セーブ</button>
   <button id="load-btn" class="buy-mode" type="button">ロード</button>
   <button id="reset-btn" class="buy-mode" type="button">データ削除</button>
 </div>
<div class="buy-controls">
  <button class="buy-mode active" data-mode="1">1個</button>
  <button class="buy-mode" data-mode="10">10個</button>
  <button class="buy-mode" data-mode="max">最大</button>
</div>
<section class="section"><h2>錬成施設</h2><div id="facilities"></div></section>
<div class="section rebirth-section">
  <h2>転生</h2>
  <div class="card">
    <div class="icon">♻️</div>
    <div class="info">
      <div class="name">転生回数：<span id="rebirth-count">0</span></div>
      <div class="desc">必要マナ：<span id="rebirth-requirement">1e8</span></div>
    </div>
    <button id="rebirth-btn" class="buy" type="button">転生</button>
  </div>
</div>
<div class="tabs"><div class="tab">錬成</div><div class="tab">転生</div><div class="tab">図鑑</div></div>

<div id="alchemy-modal" class="alchemy-modal">
  <div class="alchemy-window">
    <div class="alchemy-head">
      <div>
        <div class="alchemy-title">錬成</div>
        <div class="subtitle">一度だけ錬成できる、永久に残る特殊能力</div>
      </div>
      <button id="alchemy-close" class="alchemy-close" type="button">×</button>
    </div>
    <div id="alchemy-list" class="alchemy-list"></div>
    <div class="alchemy-status" id="alchemy-status"></div>
  </div>
</div>
</div>
<script>
const facilities=[
 ["📖","魔導書",10,"マナ"],
 ["circle","魔法陣",200,"魔導書"],
 ["💍","精霊の指輪",4000,"魔法陣"],
 ["🧪","エリクサー",800000,"精霊の指輪"],
 ["globe","天球儀",1.6e9,"エリクサー"],
 ["cube","結界",3.2e17,"天球儀"],
 ["🌳","世界樹",6.4e33,"結界"],
 ["💎","賢者の石",1.28e66,"世界樹"]
];
const alchemyItems=[
  {name:"時の砂", price:1e10, icon:"hourglass", desc:"ゲームを閉じている間も、施設の生産量に応じてマナを獲得する。"},
  {name:"自動人形", price:1e20, icon:"automaton", desc:"約5回/秒で自動的にタップする。ON/OFFを切り替えられる。"},
  {name:"錬成機関", price:1e50, icon:"engine", desc:"設定した施設を、購入可能になったとき自動で購入する。"},
  {name:"時空の核", price:1e100, icon:"space", desc:"ゲーム全体の進行速度を2倍にする。"},
  {name:"創世神の血", price:1e200, icon:"blood", desc:"転生による10レベルごとのボーナスを2倍にする。"}
];

let alchemyOwned=Array(5).fill(false);
let autoTapEnabled=false;
let autoBuyEnabled=Array(8).fill(false);
let offlineLast=Date.now();

let mana=0;
let rebirthCount=0;
let tap=1+rebirthCount;
const levels=Array(8).fill(0);
const owned=Array(8).fill(0);
// 次回購入価格を各施設ごとに保持。1個買いでもまとめ買いでも同じ価格系列を使う。
const nextPrices=facilities.map(f=>Math.max(1,Math.floor(f[2])));
let buyMode=1; // 1 / 10 / 最大

function fmtOwned(n){
  if(n===0) return "0";
  if(!Number.isFinite(n)) return "∞";
  if(Math.abs(n)>=1e8){
    const e=Math.floor(Math.log10(Math.abs(n)));
    const m=n/Math.pow(10,e);
    return m.toFixed(2)+"e"+e;
  }
  return Math.floor(n).toLocaleString("ja-JP");
}

function fmt(n){
  if(n===0) return "0";
  if(!Number.isFinite(n)) return "∞";
  if(Math.abs(n)>=1e8){
    const e=Math.floor(Math.log10(Math.abs(n)));
    const m=n/Math.pow(10,e);
    return m.toFixed(2)+"e"+e;
  }
  if(Math.abs(n)>=100){
    return Math.floor(n).toLocaleString("ja-JP");
  }
  return Number(n.toFixed(2)).toLocaleString("ja-JP",{maximumFractionDigits:2});
}

// 次の購入価格 = 今回の購入価格 × (1 + 0.1 × log10(今回の購入価格))
// 購入価格は実際に支払う整数価格を基準に次へ進める。
function nextPriceFrom(currentPrice, nextLevel){
  let p=currentPrice;
  const factor=1 + 0.1*Math.log10(p);
  p*=factor;

  if(nextLevel%10===0) p*=10;
  if(nextLevel%50===0) p*=10;
  if(nextLevel%100===0) p*=10;

  return Number.isFinite(p) ? Math.max(1,Math.floor(p)) : p;
}

function price(i){
  return nextPrices[i];
}


function fmtDurationSeconds(sec){
  if(sec<60) return Math.floor(sec)+"秒";
  if(sec<3600) return Math.floor(sec/60)+"分";
  return Math.floor(sec/3600)+"時間";
}

function alchemyHas(i){ return !!alchemyOwned[i]; }

function alchemyPurchase(i){
  const a=alchemyItems[i];
  if(alchemyOwned[i] || mana<a.price) return;
  mana-=a.price;
  alchemyOwned[i]=true;
  renderAlchemy();
  render();
}

function renderAlchemy(){
  const box=document.getElementById("alchemy-list");
  if(!box) return;
  box.innerHTML="";
  alchemyItems.forEach((a,i)=>{
    const card=document.createElement("div");
    card.className="alchemy-card"+(alchemyOwned[i]?" done":"");
    const icon='<div class="alchemy-icon '+a.icon+'">'+(i===0?"⌛":i===1?"⚙":i===2?"✦":i===3?"✧":"🩸")+'</div>';
    let action="";
    if(!alchemyOwned[i]){
      action='<button class="alchemy-buy" type="button">錬成<br><span>'+fmt(a.price)+'</span></button>';
    }else if(i===1){
      action='<div class="alchemy-toggle"><span>自動タッチ</span><button class="toggle-btn '+(autoTapEnabled?"on":"")+'" type="button">'+(autoTapEnabled?"ON":"OFF")+'</button></div>';
    }else if(i===2){
      action='<div class="alchemy-toggle"><span>自動購入</span><button class="toggle-btn '+(autoBuyEnabled.some(Boolean)?"on":"")+'" type="button">設定</button></div>';
    }else{
      action='<div class="alchemy-owned">✓ 錬成済み</div>';
    }
    card.innerHTML=icon+'<div class="alchemy-info"><div class="alchemy-name">'+a.name+'</div><div class="alchemy-desc">'+a.desc+'</div><div class="alchemy-owned">'+(alchemyOwned[i]?"✓ 錬成済み":"必要マナ："+fmt(a.price))+'</div>'+action+'</div>';
    if(!alchemyOwned[i]){
      card.querySelector(".alchemy-buy").disabled=mana<a.price;
      card.querySelector(".alchemy-buy").addEventListener("click",()=>alchemyPurchase(i));
    }else if(i===1){
      card.querySelector(".toggle-btn").addEventListener("click",()=>{
        autoTapEnabled=!autoTapEnabled; renderAlchemy();
      });
    }else if(i===2){
      card.querySelector(".toggle-btn").addEventListener("click",()=>openAutoBuySettings());
    }
    box.appendChild(card);
  });
  document.getElementById("alchemy-status").textContent=
    "錬成済み："+alchemyOwned.filter(Boolean).length+" / "+alchemyItems.length;
}

function openAlchemy(){
  document.getElementById("alchemy-modal").classList.add("open");
  renderAlchemy();
}
function closeAlchemy(){
  document.getElementById("alchemy-modal").classList.remove("open");
}

function openAutoBuySettings(){
  if(!alchemyHas(2)) return;
  const names=facilities.map(f=>f[1]);
  const choices=names.map((name,i)=>(
    '<div class="alchemy-toggle"><span>'+name+'</span><button class="toggle-btn '+(autoBuyEnabled[i]?"on":"")+'" data-i="'+i+'" type="button">'+(autoBuyEnabled[i]?"ON":"OFF")+'</button></div>'
  )).join("");
  const list=document.getElementById("alchemy-list");
  list.innerHTML='<div class="alchemy-name">自動購入する施設を選択</div>'+choices+'<button id="auto-buy-back" class="buy-mode" type="button" style="margin-top:8px;width:100%">戻る</button>';
  list.querySelectorAll(".toggle-btn").forEach(btn=>btn.addEventListener("click",()=>{
    autoBuyEnabled[Number(btn.dataset.i)]=!autoBuyEnabled[Number(btn.dataset.i)];
    openAutoBuySettings();
  }));
  document.getElementById("auto-buy-back").addEventListener("click",renderAlchemy);
}

function doAutoBuy(){
  if(!alchemyHas(2)) return;
  for(let i=0;i<8;i++){
    if(!autoBuyEnabled[i]) continue;
    const count=getPurchaseCount(i);
    if(count>0) buyLevels(i,count);
  }
}

function productionPerUnit(i){
  const lv=levels[i];
  if(lv<=0) return 0;
  const tenLevelBonus=(2+rebirthCount)*(alchemyHas(4)?2:1);
  return 0.1*Math.pow(1.1,lv-1)*Math.pow(tenLevelBonus,Math.floor(lv/10));
}

function iconHTML(type){
  if(type==="circle") return '<div class="icon circle"></div>';
  if(type==="globe") return '<div class="icon globe"></div>';
  if(type==="cube") return '<div class="icon cube"></div>';
  return '<div class="icon">'+type+'</div>';
}

function totalCost(i,count){
  let total=0;
  let p=nextPrices[i];
  let lv=levels[i];

  for(let k=0;k<count;k++){
    if(!Number.isFinite(p)) return p;
    total+=p;
    if(!Number.isFinite(total) || total>mana) return total;
    lv++;
    p=nextPriceFrom(p,lv);
  }
  return total;
}

function getPurchaseCount(i){
  if(buyMode===1) return mana>=price(i) ? 1 : 0;

  if(buyMode===10){
    const cost=totalCost(i,10);
    return cost<=mana ? 10 : 0;
  }

  // 最大：現在の次回価格から、1個ずつ進めた場合と同じ価格系列で計算。
  let n=0, spent=0, p=nextPrices[i], lv=levels[i];
  while(n<100000){
    if(!Number.isFinite(p) || spent+p>mana) break;
    spent+=p;
    n++;
    lv++;
    p=nextPriceFrom(p,lv);
  }
  return n;
}

function buyLevels(i,count){
  if(count<=0) return;

  const cost=totalCost(i,count);
  if(!Number.isFinite(cost) || cost>mana) return;

  mana-=cost;

  // 価格を「購入した回数」だけ順番に進める。
  // これにより1個ずつ購入しても、10個/最大でまとめ買いしても、
  // 次回価格が完全に同じになる。
  let p=nextPrices[i];
  let lv=levels[i];
  for(let k=0;k<count;k++){
    lv++;
    p=nextPriceFrom(p,lv);
  }

  const wasLevelZero=levels[i]===0;
  levels[i]=lv;
  nextPrices[i]=p;

  // 最初のレベルアップ時だけ所持数を1個獲得。
  if(wasLevelZero) owned[i]=1;

  render();
}

function rebirthRequirement(){
  const exponent=Math.pow(2,rebirthCount+3);
  return Math.pow(10,exponent);
}

function resetForRebirth(){
  mana=0;
  tap=1+rebirthCount;
  for(let i=0;i<levels.length;i++){
    levels[i]=0;
    owned[i]=0;
    nextPrices[i]=Math.max(1,Math.floor(facilities[i][2]));
  }
}

function doRebirth(){
  const req=rebirthRequirement();
  if(mana<req) return;
  rebirthCount++;
  resetForRebirth();
  render();
}

function render(){
  const req=rebirthRequirement();
  document.getElementById("rebirth-count").textContent=rebirthCount;
  document.getElementById("rebirth-requirement").textContent=fmt(req);
  const rebirthBtn=document.getElementById("rebirth-btn");
  rebirthBtn.disabled=mana<req;
  rebirthBtn.onclick=doRebirth;

  const box=document.getElementById("facilities");

  // Build cards only once. Replacing the whole facilities DOM every frame
  // was making the buttons unreliable to click.
  if(box.children.length!==8){
    box.innerHTML="";
    for(let i=0;i<8;i++){
      const f=facilities[i];
      const el=document.createElement("div");
      el.className="card";
      const desc=i===0?"マナを生成":f[3]+"を生成";

      el.innerHTML=
        iconHTML(f[0])+
        '<div class="info">'+
        '<div class="name">'+(i+1)+'. '+f[1]+'</div>'+
        '<div class="desc">'+desc+'</div>'+
        '<div class="lv"></div>'+
        '</div>'+
        '<button class="buy" type="button">購入<br><span class="price"></span></button>';

      el.querySelector("button").addEventListener("click",function(){
        const count=getPurchaseCount(i);
        if(count>0) buyLevels(i,count);
      });

      box.appendChild(el);
    }
  }

  // Update text/state without replacing the buttons.
  for(let i=0;i<8;i++){
    const f=facilities[i];
    const el=box.children[i];
    const p=productionPerUnit(i);
    const total=owned[i]*p;
    const c=price(i);

    el.querySelector(".lv").textContent='Lv.'+levels[i];
    el.querySelector(".desc").textContent=
      (i===0?fmt(total)+" マナ/秒":"+"+fmt(total)+" "+f[3]+"/秒")+
      "　所持："+fmtOwned(owned[i]);

    const btn=el.querySelector("button");
    const selectedCount=buyMode===1?1:(buyMode===10?10:getPurchaseCount(i));
    const selectedCost=selectedCount>0?totalCost(i,selectedCount):c;
    btn.disabled=selectedCount<=0 || selectedCost>mana;
    btn.querySelector(".price").textContent=buyMode==="max" && selectedCount>0
      ? fmt(selectedCost)+" ("+selectedCount+"個)"
      : fmt(selectedCost);
  }
}


const SAVE_KEY="MANALCHEMY_SAVE_V2";

function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({
      mana,
      rebirthCount,
      levels:[...levels],
      owned:[...owned],
      nextPrices:[...nextPrices],
      alchemyOwned:[...alchemyOwned],
      autoTapEnabled,
      autoBuyEnabled:[...autoBuyEnabled]
    }));
    return true;
  }catch(e){
    return false;
  }
}

function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const d=JSON.parse(raw);

    mana=Number.isFinite(Number(d.mana)) ? Number(d.mana) : 0;
    rebirthCount=Math.max(0,Math.floor(Number(d.rebirthCount)||0));

    for(let i=0;i<8;i++){
      levels[i]=Array.isArray(d.levels) && Number.isFinite(Number(d.levels[i]))
        ? Number(d.levels[i]) : 0;
      owned[i]=Array.isArray(d.owned) && Number.isFinite(Number(d.owned[i]))
        ? Number(d.owned[i]) : 0;
      nextPrices[i]=Array.isArray(d.nextPrices) && Number.isFinite(Number(d.nextPrices[i]))
        ? Number(d.nextPrices[i]) : Math.max(1,Math.floor(facilities[i][2]));
    }
    alchemyOwned=Array.isArray(d.alchemyOwned) ? alchemyItems.map((_,i)=>!!d.alchemyOwned[i]) : Array(5).fill(false);
    autoTapEnabled=!!d.autoTapEnabled && alchemyOwned[1];
    autoBuyEnabled=Array.isArray(d.autoBuyEnabled) ? facilities.map((_,i)=>!!d.autoBuyEnabled[i]) : Array(8).fill(false);
    offlineLast=Date.now();

    tap=1+rebirthCount;
    return true;
  }catch(e){
    return false;
  }
}

document.getElementById("save-btn").addEventListener("click",function(){
  if(saveGame()) this.textContent="保存しました";
  setTimeout(()=>this.textContent="セーブ",1000);
});

document.getElementById("load-btn").addEventListener("click",function(){
  if(loadGame()) render();
  this.textContent="ロード完了";
  setTimeout(()=>this.textContent="ロード",1000);
});

document.getElementById("reset-btn").addEventListener("click",function(){
  if(!confirm("セーブデータを削除して最初から始めますか？")) return;
  localStorage.removeItem(SAVE_KEY);
  mana=0;
  rebirthCount=0;
  tap=1;
  for(let i=0;i<8;i++){
    levels[i]=0;
    owned[i]=0;
    nextPrices[i]=Math.max(1,Math.floor(facilities[i][2]));
  }
  alchemyOwned=Array(5).fill(false);
  autoTapEnabled=false;
  autoBuyEnabled=Array(8).fill(false);
  render();
  renderAlchemy();
});

setInterval(saveGame,5000);


document.querySelector(".tabs .tab").addEventListener("click",openAlchemy);
document.getElementById("alchemy-close").addEventListener("click",closeAlchemy);
document.getElementById("alchemy-modal").addEventListener("click",e=>{
  if(e.target.id==="alchemy-modal") closeAlchemy();
});

document.querySelectorAll(".buy-mode").forEach(btn=>{
  btn.addEventListener("click",()=>{
    buyMode=btn.dataset.mode==="max" ? "max" : Number(btn.dataset.mode);
    document.querySelectorAll(".buy-mode").forEach(b=>b.classList.toggle("active",b===btn));
    render();
  });
});

document.getElementById("core").addEventListener("click",function(e){
  mana+=tap;
  const p=document.createElement("div");
  p.className="pop";
  p.textContent="+"+fmt(tap);
  p.style.left=(e.clientX-15)+"px";
  p.style.top=(e.clientY-10)+"px";
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),700);
});

let last=performance.now();
function tick(now){
  let dt=Math.min((now-last)/1000,0.25);
  last=now;
  if(alchemyHas(3)) dt*=2;
  if(autoTapEnabled && alchemyHas(1)) mana+=tap*5*dt;
  doAutoBuy();

  const generated=Array(8).fill(0);
  for(let i=1;i<8;i++){
    generated[i-1]=owned[i]*productionPerUnit(i)*dt;
  }
  for(let i=0;i<8;i++) owned[i]+=generated[i];

  mana+=owned[0]*productionPerUnit(0)*dt;

  document.getElementById("amount").textContent=fmt(mana);
  document.getElementById("rate").textContent="+"+fmt(owned[0]*productionPerUnit(0))+" / 秒";
  render();
  requestAnimationFrame(tick);
}

loadGame();
tap=1+rebirthCount;

// 時の砂：ゲームを閉じている間の簡易オフライン報酬
if(alchemyHas(0)){
  const elapsed=Math.max(0,(Date.now()-offlineLast)/1000);
  const capped=Math.min(elapsed,8*3600);
  let offlineRate=0;
  for(let i=0;i<8;i++) offlineRate+=owned[i]*productionPerUnit(i);
  mana+=offlineRate*capped;
}
offlineLast=Date.now();

tap=1+rebirthCount;
render();
renderAlchemy();
requestAnimationFrame(tick);
</script>
</body>
